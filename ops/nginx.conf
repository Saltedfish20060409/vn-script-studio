# 80 → 301 HTTPS（证书续期走 DNS 验证，无需 .well-known）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vnscriptstudio.cn www.vnscriptstudio.cn;

    ssl_certificate     /etc/nginx/certs/vnscriptstudio.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/vnscriptstudio.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---- 统一到主域 ----
    # www 与主域是两个不同 origin：刷新 cookie / localStorage / Service Worker 都按
    # host 隔离 —— 用户在 www 登录后访问主域会显示未登录（反之亦然）。线上确实出现过
    # www 下的资源请求，所以做 301 归一。（证书 SAN 同时覆盖 apex 与 www）
    if ($host = www.vnscriptstudio.cn) {
        return 301 https://vnscriptstudio.cn$request_uri;
    }

    # ---- 压缩（nginx 默认 gzip off，必须显式开）----
    # 实测不动它时：主 bundle 333KB 原样传输，移动端首屏明显偏慢。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: 自托管资源 + 内联样式（CSS Modules 注入 style 标签需要 'unsafe-inline'）。
    # img-src 必须放行 data:——背景图是以 data URL 存进设置的。
    # media-src / worker-src 的 blob: 是音乐条与语音相关音频（blob 播放）与 Worker 需要；
    #   只靠 default-src 'self' 会把它挡掉（线上实测过）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # microphone=(self)：写作页「语音输入」走 Web Speech API，需要麦克风权限；
    #   写成 microphone=() 等于对所有人禁用（仓库模板曾经就是这样，与线上不一致）。
    #   camera / geolocation 保持关闭。
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # 上传上限：与后端 2MB 口径一致
    client_max_body_size 3m;

    # ---- 缓存策略 ----
    # Vite 产物带内容哈希 → 可长期缓存；index.html / sw.js 必须每次校验，否则浏览器会
    # 拿旧 HTML 去请求已经不存在的 chunk（线上报过 "Failed to fetch dynamically
    # imported module"，白屏就是这么来的）。
    #
    # 只用 `expires`（直接写 Cache-Control/Expires），**不用 add_header**：nginx 的
    # add_header 一旦出现在 location 里，会覆盖掉从 server 继承的安全响应头，
    # 等于把 CSP/HSTS 弄丢。
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri @spa;
    }

    location @spa {
        # 注意：SPA 入口（`/`、`/login` 等）走的是这里，不是 `location = /index.html`
        # —— 所以 no-cache 必须在这里也写一遍，否则浏览器会拿旧 HTML 去要已删除的 chunk。
        expires -1;
        rewrite ^ /index.html break;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加 XFF——客户端伪造的 X-Forwarded-For 不能再绕过后端限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
