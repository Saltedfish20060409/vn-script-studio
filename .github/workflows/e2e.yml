name: e2e

# 端到端冒烟（注册 → 写作 → 生成 RPY → 导出）。
#
# 它现在是**自动**的（改动 frontend/** 或 e2e.yml 时，以及手动触发）。
#
# 为什么曾经手动、又为什么改回自动
# ------------------------------
# 历史上它每次都在"环境没配好"上失败，反而掩盖真实回归，所以被移出自动 CI。
# 但代价是：**唯一验证导出产物的那条完整旅程，再也没有人跑过**——
# 而导出正是最容易"能下载、跑不起来"的地方（缺 label start、jump 目标不存在、
# 逃逸没覆盖 [ ] 之类，都是脚本能导出、Ren'Py 一跑就报错）。
#
# 那次"必挂"的真因是**注册链路缺 AUTH_AUTO_VERIFY=true**（没配 Resend 时
# /auth/register 直接 503），不是这个工作流本身不可靠。那个开关下面已经配上了。
#
# 只在前端改动时跑：后端改动由 ci.yml / integration.yml 覆盖，跑 e2e 只是白烧几分钟。
#
# 用法：自动；也可在 Actions → e2e → Run workflow 手动指定。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"

jobs:
  smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_e2e
        ports:
          - 54102:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://vnss:vnss@localhost:54102/vnss_e2e
      # 跳过真实发信：注册直接标记已验证（否则 register 会因邮件服务未配置而 503）
      AUTH_AUTO_VERIFY: "true"
      # 空 key → 生成 RPY 走规则转换：确定性、无外部调用
      DEEPSEEK_API_KEY: ""
      SECRET_KEY: e2e-test-secret-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: |
          cd ../backend
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Frontend deps
        run: npm ci
      - name: Build frontend (preview server source)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Desktop harness tests (no backend needed)
        run: npm run test:harness
      - name: E2E smoke tests
        run: npm run test:e2e
