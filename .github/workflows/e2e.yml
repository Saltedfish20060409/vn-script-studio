name: e2e

# 端到端冒烟（注册 → 写作 → 生成 RPY → 导出）—— **手动触发**。
#
# 为什么手动：跑通它需要一整套环境（Postgres + 后端 + 构建好的前端 + Playwright
# 浏览器），而且注册链路依赖"邮件服务或自动验证"这类开关。历史上它每次都在
# "环境没配好"上失败，反而掩盖了真实回归，所以移出自动 CI，改成想跑时手动跑。
#
# 关键：AUTH_AUTO_VERIFY=true 让注册跳过真实发信 —— 这正是以前自动 e2e 必挂的原因
# （没配 Resend 时 /auth/register 会返回 503"邮件服务未配置"）。
#
# 用法：Actions → e2e → Run workflow。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_e2e
        ports:
          - 54102:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://vnss:vnss@localhost:54102/vnss_e2e
      # 跳过真实发信：注册直接标记已验证（否则 register 会因邮件服务未配置而 503）
      AUTH_AUTO_VERIFY: "true"
      # 空 key → 生成 RPY 走规则转换：确定性、无外部调用
      DEEPSEEK_API_KEY: ""
      SECRET_KEY: e2e-test-secret-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: |
          cd ../backend
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Frontend deps
        run: npm ci
      - name: Build frontend (preview server source)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
