name: db-integration

# 需要真实 PostgreSQL 的集成测试。
#
# 为什么现在改成自动跑：这些用例才是能抓住真实缺陷的那一层——jsonb 键序导致指纹漂移、
# 注册/重发验证邮件的静默失败、快照与行锁的并发语义，全都只有连真库才测得出来。
# 之前在本地用 SSH 隧道跑（又慢又会断），误以为"环境没配好所以先手动"；现在改成
# GitHub Actions 的 Postgres service（本机回环，秒级），容器内实测全量 ~2.5 分钟。
#
# 触发条件刻意收窄：只在后端代码/工作流本身变化时跑，避免前端改动白白烧掉几分钟 CI。
# 另外第一步会**显式确认测试库可达**：不可达就直接失败，而不是让用例静默 skip 掉。
#
# 用法：push/PR 自动跑；也可以在 Actions → db-integration → Run workflow 手动指定 -k 表达式。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "要跑的用例范围（pytest -k 表达式，留空=全部）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/integration.yml"

jobs:
  db-tests:
    name: backend tests against Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://vnss:vnss@localhost:15432/vnss_test
      SECRET_KEY: ci-integration-secret-key-0123456789abcdef0123456789abcdef
      # 空 Key → 模型相关路径走 mock/规则，不产生外部调用
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest httpx ruff==0.16.3
      - name: Confirm test database is reachable (fail loudly if not)
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg

          url = os.environ["DATABASE_URL_TEST"].replace("postgresql+asyncpg://", "postgresql://")

          async def main() -> None:
              conn = await asyncpg.connect(url)
              version = await conn.fetchval("select version()")
              await conn.close()
              print("db reachable:", version.split(",")[0])

          asyncio.run(main())
          PY
      - name: Integration tests (real DB)
        env:
          MARKER: ${{ github.event.inputs.marker }}
        run: |
          if [ -n "$MARKER" ]; then
            python -m pytest tests/ -q --tb=short -k "$MARKER"
          else
            python -m pytest tests/ -q --tb=short
          fi
