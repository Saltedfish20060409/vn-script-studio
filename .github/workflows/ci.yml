name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_test
        ports:
          - 54102:5432
        options: >-
          --health-cmd "pg_isready -U vnss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt ruff pytest
      - name: Ruff
        run: ruff check app tests
      - name: Pytest (with PG)
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://vnss:vnss@localhost:54102/vnss_test
          SECRET_KEY: unit-test-secret-key-0123456789abcdef0123456789abcdef
        run: pytest tests -q

  frontend:
    name: Frontend (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
