name: ci

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/harness-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/harness-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://vnss:vnss@localhost:15432/vnss_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install deps (locked)
        run: |
          python -m pip install -U pip
          pip install -r requirements-lock.txt
          pip install ruff==0.16.3
      - name: Ruff lint (hard gate)
        run: |
          ruff check app/ --output-format=github
      - name: Full backend test suite (unit + API/DB integration)
        run: |
          python -m pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (hard gate, zero warnings)
        run: npm run lint:strict
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_e2e
        ports:
          - 54102:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://vnss:vnss@localhost:54102/vnss_e2e
      DEEPSEEK_API_KEY: e2e-placeholder-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps (locked)
        run: |
          cd ../backend
          python -m pip install -U pip
          pip install -r requirements-lock.txt
      - name: Frontend deps
        run: npm ci
      - name: Build frontend (preview server source)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
