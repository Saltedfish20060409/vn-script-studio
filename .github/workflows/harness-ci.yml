name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/harness-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/harness-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://vnss:vnss@localhost:15432/vnss_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest httpx ruff==0.16.3
      - name: Verify imports (fail fast on install issues)
        run: |
          python -c "import fastapi, sqlalchemy, asyncpg, pytest, httpx, ruff; print('imports OK')"
      - name: Ruff lint (hard gate)
        run: |
          ruff check app/ --output-format=github
      - name: Full backend test suite (unit + API/DB integration)
        run: |
          python -m pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (hard gate, zero warnings)
        run: npm run lint:strict
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size guard (dist/assets/*.js)
        run: |
          # 阈值 500KB 为 gzip 前的原始字节（raw bytes），超限即失败
          node -e "const fs=require('fs'),d='dist/assets';const over=fs.readdirSync(d).filter(f=>f.endsWith('.js')&&fs.statSync(d+'/'+f).size>500*1024);if(over.length){console.error('bundle(s) exceed 500KB raw:',over.join(', '));process.exit(1)}console.log('bundle size OK: all dist/assets/*.js <= 500KB (raw, pre-gzip)')"

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vnss
          POSTGRES_PASSWORD: vnss
          POSTGRES_DB: vnss_e2e
        ports:
          - 54102:5432
        options: >-
          --health-cmd "pg_isready -U vnss -d vnss_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://vnss:vnss@localhost:54102/vnss_e2e
      # 空 key → e2e 走 rules 转换（不调外部 LLM）：确定性、无网络依赖
      DEEPSEEK_API_KEY: ""
      SECRET_KEY: e2e-test-secret-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: |
          cd ../backend
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Frontend deps
        run: npm ci
      - name: Build frontend (preview server source)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
