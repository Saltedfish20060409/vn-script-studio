org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 服务端地址：debug 与 release 统一连线上服务 https://vnscriptstudio.cn。
# 需要临时连其它服务端时，可在 App 登录页修改地址，或在 ~/.gradle/gradle.properties 里覆盖这两项。
vnss.debugServerUrl=https://vnscriptstudio.cn
vnss.releaseServerUrl=https://vnscriptstudio.cn

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
