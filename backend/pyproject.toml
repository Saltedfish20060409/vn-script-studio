[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 的规则集会随版本变：CI 装的是 `ruff==0.16.3`（见 .github/workflows/ci.yml），
# 本地如果是别的版本，就可能出现"本机绿、CI 红"（或反过来）而没人知道为什么。
# 这里把版本钉死：对不上就**直接报错**，而不是用一套不同的规则悄悄给出结论。
required-version = "0.16.3"
exclude = [
    "alembic/versions/0001_initial.py",
    "alembic/versions/0002_analysis_inbox.py",
    "alembic/versions/0003_schema_repair.py",
    "legacy",
]

[tool.ruff.lint]
# Conservative start: F (pyflakes) + E9 (syntax-ish) + a few common style rules.
# Widen later once the codebase is clean under this set.
select = ["F", "E9", "E4", "I"]
ignore = [
    "E402",  # module-level imports after code (common in this codebase)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
# 显式把 backend 加入 sys.path：不同 pytest 版本的 rootdir/conftest
# 隐式插入行为不一致（CI 曾报 No module named 'app'）
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
