name: vnss

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vnss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vnss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vnss
    volumes:
      - vnss_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnss -d vnss"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks:
      - vnss

  redis:
    image: redis:7-alpine
    container_name: vnss-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - vnss

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vnss-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - vnss

  web:
    image: nginx:1.27-alpine
    container_name: vnss-web
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *default-logging
    networks:
      - vnss
      - coolify

volumes:
  vnss_pg_data:

networks:
  vnss:
  coolify:
    external: true
