services:
  postgres:
    image: postgres:16-alpine
    container_name: vnss-postgres
    environment:
      POSTGRES_USER: vnss
      POSTGRES_PASSWORD: vnss
      POSTGRES_DB: vnss
    ports:
      - "54102:5432"
    volumes:
      - vnss_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnss -d vnss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vnss-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vnss_pg_data:
