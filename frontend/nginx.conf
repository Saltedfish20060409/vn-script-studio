# ⚠️ 这是**镜像内自带的默认配置**，用途是本地 `docker compose up` 试用，以及容器在
#    没有挂载外部配置时的兜底。**它只 listen 80、没有 TLS**。
#
#    生产不是这份：docker-compose 把服务器上的 /opt/vn-script-studio/nginx.conf 以只读方式
#    挂到 /etc/nginx/conf.d/default.conf，**那份才生效**（多 80→443 跳转、TLS、www 归一、
#    资源缓存策略）。装机脚本复制的是那份（原先复制的是本文件，等于让新机器缺上传上限与
#    TLS——已改）。也就是说：**改这里的头不影响线上**，线上要在服务器上改那份再 reload。
#    改动请两边同步，避免模板与线上越飘越远；`deploy/push.py` 每次部署会比对并打印
#    `DRIFT OK / DRIFT!!`（`--check` 可只查不部署）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传上限：与生产配置 deploy/nginx.conf 同值。
    # 少了这一行就是 nginx 默认的 1m——背景图是以 base64 data URL 存进设置 JSON 的，
    # 稍大一点的图会被 nginx 直接 413（连后端都到不了），线上踩过一次。
    client_max_body_size 3m;

    # ---- 压缩（nginx 默认 gzip off，必须显式开）----
    # 参数与线上 deploy/nginx.conf 一致。以前只有线上那份有，模板里没有，
    # 于是新装的服务器会退回"未压缩传 bundle"（主 chunk 300KB+ 原样传输，
    # 移动端首屏明显变慢）。这里补齐，避免装机时再漏一次。
    # 注意：gzip_types 里**不能**加 text/event-stream —— SSE 被压缩后 nginx 会缓冲，
    # 事件就不再实时到达（本项目的 Agent / 管线进度依赖它）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm;

    # 安全响应头（always 保证 4xx/5xx 错误页也携带）
    # 字体已自托管：CSP 不再放行 fonts.googleapis.com / fonts.gstatic.com
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # microphone=(self)：写作页语音输入（Web Speech API）需要；camera/geo 仍关
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端（含 SSE：关闭缓冲让事件流实时到达）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 健康检查直通
    location = /health {
        proxy_pass http://api:8000/health;
    }
}
