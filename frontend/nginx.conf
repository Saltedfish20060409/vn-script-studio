# ⚠️ 这是**首次装机用的模板**：deploy/setup_server.sh 会把它复制成服务器上的
#    /opt/vn-script-studio/nginx.conf，之后那份才是真正生效的文件（容器按
#    docker-compose 的 `./nginx.conf:/etc/nginx/conf.d/default.conf:ro` 挂载它）。
#    也就是说：**改这里的头不会影响线上**，线上要在服务器上改那份再重启 vnss-web；
#    改动请两边同步，避免模板与线上越飘越远（线上那份还多了 80→443 跳转、TLS、www 归一；
#    gzip 已同步到本模板，见下方）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- 压缩（nginx 默认 gzip off，必须显式开）----
    # 参数与线上 deploy/nginx.conf 一致。以前只有线上那份有，模板里没有，
    # 于是新装的服务器会退回"未压缩传 bundle"（主 chunk 300KB+ 原样传输，
    # 移动端首屏明显变慢）。这里补齐，避免装机时再漏一次。
    # 注意：gzip_types 里**不能**加 text/event-stream —— SSE 被压缩后 nginx 会缓冲，
    # 事件就不再实时到达（本项目的 Agent / 管线进度依赖它）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm;

    # 安全响应头（always 保证 4xx/5xx 错误页也携带）
    # 字体已自托管：CSP 不再放行 fonts.googleapis.com / fonts.gstatic.com
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # microphone=(self)：写作页语音输入（Web Speech API）需要；camera/geo 仍关
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端（含 SSE：关闭缓冲让事件流实时到达）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 健康检查直通
    location = /health {
        proxy_pass http://api:8000/health;
    }
}
